<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Elo Reencontro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        <div class="text-center mb-8">
            <img src="/static/logo.png" alt="Elo Reencontro" class="h-16 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Elo Workbench</h1>
            <p class="text-slate-500">Acesso exclusivo para Agentes de Cura</p>
        </div>
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Usuário</label>
                <input type="text" name="username" required placeholder="Seu nome de usuário"
                       class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#5B8FB9] outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Senha</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-[#5B8FB9] outline-none">
            </div>
            <button type="submit" class="w-full bg-[#5B8FB9] text-white font-black py-4 rounded-xl hover:bg-[#3a5c78] transition shadow-lg uppercase">
                Acessar Painel
            </button>
        </form>
    </div>
</body>
</html>
