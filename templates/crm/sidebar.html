<!-- ═══════════════════════════════════════════════════════
     MOBILE NAVBAR  (visível apenas em telas < 768px)
═══════════════════════════════════════════════════════ -->
<nav class="md:hidden fixed top-0 left-0 right-0 z-50 bg-white border-b border-slate-200" x-data="{ mobileOpen: false }">
    <div class="h-16 flex items-center justify-between px-4">
        <span class="font-black text-xl text-slate-800 tracking-tighter">Elo Reencontro</span>
        <button
            @click="mobileOpen = !mobileOpen"
            class="p-2 rounded-lg text-slate-400 hover:bg-slate-50 hover:text-elo-blue transition"
            :aria-expanded="mobileOpen"
            aria-label="Abrir menu"
        >
            <i class="fa-solid text-xl" :class="mobileOpen ? 'fa-xmark' : 'fa-bars-staggered'"></i>
        </button>
    </div>

    <!-- Drawer -->
    <div
        x-show="mobileOpen"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-2"
        @click.outside="mobileOpen = false"
        class="border-t border-slate-100 bg-white"
        x-cloak
    >
        <div class="px-3 py-4 space-y-1">

            <p class="px-3 pb-1 text-[10px] font-black text-slate-300 uppercase tracking-[0.2em]">Main Menu</p>

            <template x-for="item in [
                { name: 'Dashboard',    icon: 'fa-chart-pie',      url: '/workbench/dashboard' },
                { name: 'Acolhimentos', icon: 'fa-address-book',   url: '/workbench/acolhimentos' },
                { name: 'Tarefas',      icon: 'fa-list-check',     url: '/workbench/tarefas' },
                { name: 'Relatórios',   icon: 'fa-file-contract',  url: '/workbench/relatorios' },
                { name: 'Suporte',      icon: 'fa-headset',        url: '/workbench/chamados' }
            ]">
                <a :href="item.url"
                   @click="mobileOpen = false"
                   class="flex items-center gap-3 px-3 py-3 rounded-xl font-bold text-sm transition-all"
                   :class="window.location.pathname.includes(item.url)
                       ? 'bg-elo-blue text-white shadow-md'
                       : 'text-slate-500 hover:bg-slate-50 hover:text-elo-blue'">
                    <i class="fa-solid text-base w-5 text-center" :class="item.icon"></i>
                    <span x-text="item.name"></span>
                </a>
            </template>

            <div class="my-2 border-t border-slate-100"></div>
            <p class="px-3 pb-1 text-[10px] font-black text-slate-300 uppercase tracking-[0.2em]">Utilities</p>

            <a href="/workbench/perfil" @click="mobileOpen = false"
               class="flex items-center gap-3 px-3 py-3 rounded-xl font-bold text-sm text-slate-500 hover:bg-slate-50 hover:text-elo-blue transition-all">
                <i class="fa-solid fa-circle-user text-base w-5 text-center"></i>
                <span>Meu Perfil</span>
            </a>
            <a href="/workbench/configuracoes" @click="mobileOpen = false"
               class="flex items-center gap-3 px-3 py-3 rounded-xl font-bold text-sm text-slate-500 hover:bg-slate-50 hover:text-elo-blue transition-all">
                <i class="fa-solid fa-gear text-base w-5 text-center"></i>
                <span>Configurações</span>
            </a>

            <div class="my-2 border-t border-slate-100"></div>

            <a href="/logout"
               class="flex items-center gap-3 px-3 py-3 rounded-xl font-black text-xs uppercase tracking-widest text-red-500 hover:bg-red-50 transition-all">
                <i class="fa-solid fa-right-from-bracket text-base w-5 text-center"></i>
                <span>Sair</span>
            </a>
        </div>
    </div>
</nav>

<!-- Espaçador mobile: empurra o conteúdo abaixo da navbar fixa -->
<div class="md:hidden h-16 flex-shrink-0"></div>


<!-- ═══════════════════════════════════════════════════════
     DESKTOP SIDEBAR  (visível apenas em telas ≥ 768px)
═══════════════════════════════════════════════════════ -->
<aside
    class="hidden md:flex h-screen flex-col sidebar-transition flex-shrink-0 bg-white border-r border-slate-200 relative z-40"
    :class="isCollapsed ? 'w-20' : 'w-72'"
>
    <!-- Header -->
    <div class="h-20 flex items-center justify-between px-4 border-b border-slate-100 flex-shrink-0">
        <div x-show="!isCollapsed" x-transition.opacity class="overflow-hidden">
            <span class="font-black text-2xl text-slate-800 tracking-tighter whitespace-nowrap">Elo Reencontro</span>
        </div>
        <button
            @click="isCollapsed = !isCollapsed; localStorage.setItem('sidebarCollapsed', isCollapsed)"
            class="p-2 hover:bg-slate-50 rounded-lg transition text-slate-400 hover:text-elo-blue ml-auto flex-shrink-0"
            aria-label="Recolher menu"
        >
            <i class="fa-solid fa-bars-staggered text-xl"></i>
        </button>
    </div>

    <!-- Body -->
    <div class="flex-1 py-6 space-y-8 overflow-y-auto scroller-navy">

        <div class="space-y-1">
            <p x-show="!isCollapsed" x-cloak class="px-6 pb-1 text-[10px] font-black text-slate-300 uppercase tracking-[0.2em] whitespace-nowrap">Main Menu</p>
            <nav class="px-3 space-y-0.5">
                <template x-for="item in [
                    { name: 'Dashboard',    icon: 'fa-chart-pie',      url: '/workbench/dashboard' },
                    { name: 'Acolhimentos', icon: 'fa-address-book',   url: '/workbench/acolhimentos' },
                    { name: 'Tarefas',      icon: 'fa-list-check',     url: '/workbench/tarefas' },
                    { name: 'Relatórios',   icon: 'fa-file-contract',  url: '/workbench/relatorios' },
                    { name: 'Suporte',      icon: 'fa-headset',        url: '/workbench/chamados' }
                ]">
                    <a :href="item.url"
                       class="flex items-center gap-4 px-3 py-3.5 rounded-xl font-bold text-sm transition-all duration-200"
                       :class="[
                           window.location.pathname.includes(item.url)
                               ? 'bg-elo-blue text-white shadow-lg shadow-blue-500/20'
                               : 'text-slate-500 hover:bg-slate-50 hover:text-elo-blue',
                           isCollapsed ? 'justify-center' : ''
                       ]">
                        <i class="fa-solid text-lg flex-shrink-0 w-6 text-center" :class="item.icon"></i>
                        <span x-show="!isCollapsed" x-transition.opacity class="whitespace-nowrap" x-text="item.name"></span>
                    </a>
                </template>
            </nav>
        </div>

        <div class="space-y-1">
            <p x-show="!isCollapsed" x-cloak class="px-6 pb-1 text-[10px] font-black text-slate-300 uppercase tracking-[0.2em] whitespace-nowrap">Utilities</p>
            <nav class="px-3 space-y-0.5">
                <a href="/workbench/perfil"
                   class="flex items-center gap-4 px-3 py-3.5 rounded-xl font-bold text-sm text-slate-500 hover:bg-slate-50 hover:text-elo-blue transition-all"
                   :class="isCollapsed ? 'justify-center' : ''">
                    <i class="fa-solid fa-circle-user text-lg flex-shrink-0 w-6 text-center"></i>
                    <span x-show="!isCollapsed" x-transition.opacity class="whitespace-nowrap">Meu Perfil</span>
                </a>
                <a href="/workbench/configuracoes"
                   class="flex items-center gap-4 px-3 py-3.5 rounded-xl font-bold text-sm text-slate-500 hover:bg-slate-50 hover:text-elo-blue transition-all"
                   :class="isCollapsed ? 'justify-center' : ''">
                    <i class="fa-solid fa-gear text-lg flex-shrink-0 w-6 text-center"></i>
                    <span x-show="!isCollapsed" x-transition.opacity class="whitespace-nowrap">Configurações</span>
                </a>
            </nav>
        </div>

    </div>

    <!-- Footer -->
    <div class="p-4 border-t border-slate-100 flex-shrink-0">
        <a href="/logout"
           class="flex items-center gap-4 px-3 py-4 rounded-xl font-black text-xs uppercase tracking-widest text-red-500 hover:bg-red-50 transition-all"
           :class="isCollapsed ? 'justify-center' : ''">
            <i class="fa-solid fa-right-from-bracket text-lg flex-shrink-0 w-6 text-center"></i>
            <span x-show="!isCollapsed" x-transition.opacity class="whitespace-nowrap">Sair</span>
        </a>
    </div>
</aside>
