<style>
    /* Oculta o ícone nativo feio, mas mantém o clique em toda a área do input */
    .custom-date-input::-webkit-calendar-picker-indicator {
        opacity: 0;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        cursor: pointer;
    }
    .custom-date-input {
        color: #334155; /* text-slate-700 */
        position: relative;
    }
    /* Se a data estiver vazia no Chrome, o texto fica cinza */
    .custom-date-input::-webkit-datetime-edit-fields-wrapper {
        padding: 0;
    }
</style>

<div x-show="editModal" 
     class="fixed inset-0 z-50 overflow-y-auto" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     x-cloak>
    
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <div class="fixed inset-0 transition-opacity bg-slate-900/60 backdrop-blur-sm" @click="editModal = false"></div>

        <div class="inline-block overflow-hidden text-left align-bottom transition-all transform bg-white rounded-[2.5rem] shadow-2xl sm:my-8 sm:align-middle w-full max-w-5xl relative z-10">
            
            <form action="/api/atualizar-acolhimento/{{ ac.id }}" method="POST">
                
                <div class="bg-elo-navy px-10 py-8 text-white flex justify-between items-center">
                    <div>
                        <h3 class="text-2xl font-black tracking-tight">Editar Oportunidade</h3>
                        <p class="text-elo-light/70 text-sm font-medium">Atualize os dados clínicos e comerciais do caso #{{ ac.id }}</p>
                    </div>
                    <button type="button" @click="editModal = false" class="bg-white/10 hover:bg-white/20 p-2 rounded-full transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="px-10 py-8 max-h-[70vh] overflow-y-auto bg-slate-50 space-y-8">
                    
                    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                        <h4 class="text-[10px] font-black text-elo-blue uppercase tracking-widest mb-6 flex items-center gap-2">
                            <span class="w-2 h-2 bg-elo-blue rounded-full"></span> Pipeline e Fechamento
                        </h4>
                        
                        <div class="grid grid-cols-12 gap-6">
                            <div class="col-span-4">
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Status do Funil</label>
                                <select name="status" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                    <option value="Novo" {% if ac.status == 'Novo' %}selected{% endif %}>Novo</option>
                                    <option value="Em Atendimento" {% if ac.status == 'Em Atendimento' %}selected{% endif %}>Em Atendimento</option>
                                    <option value="Apresentação" {% if ac.status == 'Apresentação' %}selected{% endif %}>Apresentação</option>
                                    <option value="Internado (Ganho)" {% if ac.status == 'Internado (Ganho)' %}selected{% endif %}>Internado (Ganho)</option>
                                    <option value="Perdido" {% if ac.status == 'Perdido' %}selected{% endif %}>Perdido</option>
                                </select>
                            </div>
                            <div class="col-span-4">
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Urgência</label>
                                <select name="urgencia" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                    <option value="Média" {% if ac.urgencia == 'Média' %}selected{% endif %}>Média</option>
                                    <option value="Alta" {% if ac.urgencia == 'Alta' %}selected{% endif %}>Alta</option>
                                    <option value="Crítica" {% if ac.urgencia == 'Crítica' %}selected{% endif %}>Crítica</option>
                                </select>
                            </div>
                            <div class="col-span-4">
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Investimento Previsto</label>
                                <input type="text" name="investimento_estimado" value="{{ ac.investimento_estimado or '' }}" placeholder="Ex: R$ 3.500" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                            </div>
                            
                            <div class="col-span-12 border-b border-slate-100 my-2"></div>

                            <div class="col-span-6">
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Previsão de Internação (Fechamento)</label>
                                <div class="relative">
                                    <input type="date" name="previsao_internacao" value="{{ ac.previsao_internacao }}" class="custom-date-input w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-elo-blue bg-slate-50 pl-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    </div>
                                </div>
                            </div>
                            <div class="col-span-6">
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Previsão de Cura (Fim do Contrato)</label>
                                <div class="relative">
                                    <input type="date" name="previsao_cura" value="{{ ac.previsao_cura }}" class="custom-date-input w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-elo-blue bg-slate-50 pl-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-12 gap-8">
                        
                        <div class="col-span-12 lg:col-span-6 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-5">
                            <h4 class="text-[10px] font-black text-elo-blue uppercase tracking-widest mb-4 flex items-center gap-2">
                                <span class="w-2 h-2 bg-elo-blue rounded-full"></span> Dados do Paciente
                            </h4>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Nome do Paciente</label>
                                <input type="text" name="paciente_nome" value="{{ ac.paciente.nome_completo }}" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Tipo de Internação</label>
                                <select name="tipo_internacao" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                    <option value="" {% if not ac.tipo_internacao %}selected{% endif %}>Selecione...</option>
                                    <option value="Voluntária" {% if ac.tipo_internacao == 'Voluntária' %}selected{% endif %}>Voluntária</option>
                                    <option value="Involuntária" {% if ac.tipo_internacao == 'Involuntária' %}selected{% endif %}>Involuntária</option>
                                    <option value="Compulsória" {% if ac.tipo_internacao == 'Compulsória' %}selected{% endif %}>Compulsória</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Substâncias em Uso</label>
                                <textarea name="substancias_uso" rows="3" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-elo-blue/20 transition resize-none">{{ ac.substancias_uso or '' }}</textarea>
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Comorbidades</label>
                                <textarea name="comorbidades" rows="3" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-medium outline-none focus:ring-2 focus:ring-elo-blue/20 transition resize-none">{{ ac.comorbidades or '' }}</textarea>
                            </div>
                        </div>

                        <div class="col-span-12 lg:col-span-6 bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-5">
                            <h4 class="text-[10px] font-black text-elo-blue uppercase tracking-widest mb-4 flex items-center gap-2">
                                <span class="w-2 h-2 bg-elo-blue rounded-full"></span> Dados do Decisor
                            </h4>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Nome Completo</label>
                                <input type="text" name="decisor_nome" value="{{ ac.decisor.nome_completo }}" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">WhatsApp</label>
                                    <input type="text" name="decisor_whatsapp" value="{{ ac.decisor.whatsapp }}" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Parentesco</label>
                                    <input type="text" name="decisor_parentesco" value="{{ ac.decisor.parentesco or '' }}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">E-mail</label>
                                <input type="email" name="decisor_email" value="{{ ac.decisor.email or '' }}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                            </div>
                            <div class="grid grid-cols-3 gap-4">
                                <div class="col-span-1">
                                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">CEP</label>
                                    <input type="text" name="decisor_cep" value="{{ ac.decisor.cep or '' }}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Endereço de Resgate</label>
                                    <input type="text" name="decisor_endereco" value="{{ ac.decisor.endereco or '' }}" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-elo-blue/20 transition">
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="px-10 py-6 bg-white border-t border-slate-100 flex justify-end gap-4 rounded-b-[2.5rem]">
                    <button type="button" @click="editModal = false" class="px-6 py-3 text-sm font-black text-slate-400 uppercase tracking-widest hover:text-slate-600 transition">
                        Descartar
                    </button>
                    <button type="submit" class="px-10 py-3 bg-elo-navy text-white text-sm font-black uppercase tracking-widest rounded-2xl hover:bg-elo-blue transition shadow-xl shadow-elo-navy/20">
                        Salvar Dossiê
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
