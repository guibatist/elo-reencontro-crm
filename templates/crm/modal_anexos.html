<template x-if="uploadModal">
    <div class="fixed inset-0 z-[100] flex items-center justify-center p-6 backdrop-blur-md bg-slate-900/60">
        <div @click.away="!uploading && (uploadModal = false)" class="bg-white w-full max-w-2xl rounded-[3rem] shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
            
            <div class="px-10 py-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <div>
                    <h3 class="text-2xl font-black text-slate-900 tracking-tighter">Documentos do Paciente</h3>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Gerenciamento de Arquivos</p>
                </div>
                <button @click="uploadModal = false" class="w-10 h-10 text-slate-400 hover:text-red-500 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="p-10">
                <div class="space-y-4 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">
                    {% for anexo in ac.anexos | sort(attribute='data_criacao', reverse=True) %}
                    <div class="flex items-center justify-between p-5 bg-white rounded-[1.5rem] border border-slate-100 hover:border-blue-100 transition shadow-sm">
                        <div class="flex items-center gap-4 overflow-hidden">
                            <div class="w-12 h-12 bg-blue-50 text-elo-blue rounded-xl flex items-center justify-center">
                                <i class="fa-solid fa-file-pdf text-xl"></i>
                            </div>
                            <div class="overflow-hidden">
                                <p class="text-xs font-black text-slate-800 truncate w-48">{{ anexo.nome_original }}</p>
                                <p class="text-[9px] text-slate-400 font-black uppercase tracking-tighter">{{ anexo.data_criacao.strftime('%d/%m/%Y') }}</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <a href="/uploads/anexos/{{ anexo.caminho }}" target="_blank" class="w-10 h-10 bg-slate-50 text-slate-400 hover:bg-elo-blue hover:text-white rounded-xl flex items-center justify-center transition">
                                <i class="fa-solid fa-eye text-xs"></i>
                            </a>
                            <form action="/api/anexo/{{ anexo.id }}/deletar" method="POST">
                                <button class="w-10 h-10 bg-slate-50 text-slate-300 hover:bg-red-500 hover:text-white rounded-xl flex items-center justify-center transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</template>
