{% extends 'crm/base.html' %}
{% block content %}
<div class="p-10 max-w-3xl">
    <header class="mb-10">
        <h1 class="text-4xl font-black text-slate-900 tracking-tighter">Configurações</h1>
        <p class="text-slate-500 font-medium">Gerencie sua conta e preferências do sistema.</p>
    </header>

    <div class="space-y-6">
        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm">
            <h2 class="text-lg font-black mb-6">Perfil do Consultor</h2>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Nome de Exibição</label>
                    <input type="text" value="{{ current_user.nome }}" disabled class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl text-slate-500">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Cargo / Acesso</label>
                    <input type="text" value="{{ current_user.role | capitalize }}" disabled class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl text-slate-500">
                </div>
            </div>
        </div>

        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm">
            <h2 class="text-lg font-black mb-4">Segurança</h2>
            <button class="bg-slate-100 text-slate-900 px-6 py-3 rounded-xl font-bold hover:bg-slate-200 transition">
                Alterar Senha
            </button>
        </div>

        <div class="bg-red-50 p-8 rounded-[2rem] border border-red-100">
            <h2 class="text-lg font-black text-red-900 mb-2">Zona de Perigo</h2>
            <p class="text-sm text-red-700 mb-4">Ao sair, sua sessão será encerrada em todos os dispositivos.</p>
            <a href="/logout" class="bg-red-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-red-700 transition inline-block">
                SAIR DO SISTEMA
            </a>
        </div>
    </div>
</div>
{% endblock %}
