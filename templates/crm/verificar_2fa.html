<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white rounded-[3.5rem] shadow-2xl p-16 border border-slate-100 text-center relative overflow-hidden">
        <div class="w-20 h-20 bg-blue-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-xl shadow-blue-200">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
        <h1 class="text-4xl font-black text-slate-900 tracking-tighter mb-4">Segurança Elo</h1>
        <p class="text-slate-500 mb-10 font-medium">Verifique seu e-mail e defina uma senha segura.</p>
        
        <form action="/verificar-2fa" method="POST" class="space-y-8">
            <input type="text" name="codigo" required maxlength="6" placeholder="CÓDIGO" 
                   class="w-full bg-slate-50 border-2 border-slate-100 p-8 rounded-3xl text-center text-5xl font-black tracking-[0.4em] text-blue-600 outline-none focus:border-blue-600 uppercase transition-all">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                <input type="password" name="nova_senha" required placeholder="Nova Senha" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-50">
                <input type="password" name="confirmar_senha" required placeholder="Repetir Senha" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-2xl font-bold outline-none focus:ring-4 focus:ring-blue-50">
            </div>

            <button type="submit" class="w-full bg-[#0F172A] text-white font-black py-6 rounded-3xl hover:bg-blue-600 transition-all uppercase tracking-widest text-sm shadow-xl shadow-blue-900/10">Ativar Conta</button>
        </form>
    </div>
</body>
</html>
